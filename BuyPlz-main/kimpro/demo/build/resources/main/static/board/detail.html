<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godhub - Q&A 상세 보기</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo" onclick="location.href='/'">Godhub</div>
            <nav class="top-nav">
                <a href="/">홈</a>
                <a href="/about.html">사이트 소개</a>
                <a href="/board/list.html" class="active">게시판</a>
                <a href="/board/write.html">글작성</a>
            </nav>
        </div>
    </header>

    <main class="page-card" style="max-width: 800px;">
        <div class="detail-header">
            <h1 id="title" class="page-title" style="border-bottom: none; margin-bottom: 0;">불러오는 중...</h1>
            <div class="detail-info">
                <span>작성자: <strong id="writer" style="color:#333;">-</strong></span>
                <span>작성일: <span id="date">-</span></span>
                <span>조회수: <span id="views">0</span></span>
            </div>
        </div>

        <div id="content" class="detail-content">내용을 불러오는 중입니다...</div>

        <a class="btn-gray" href="/board/list.html">목록으로 돌아가기</a>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const boardId = urlParams.get('id');

        if (boardId) {
            fetch("/api/boards/" + boardId)
                .then(res => {
                    if (!res.ok) throw new Error("게시글을 찾을 수 없습니다.");
                    return res.json();
                })
                .then(board => {
                    document.getElementById("title").innerText = board.title;
                    document.getElementById("writer").innerText = board.writer;
                    document.getElementById("date").innerText = board.createdDate ? board.createdDate.substring(0, 10) : '-';
                    document.getElementById("views").innerText = board.views ?? 0;
                    document.getElementById("content").innerText = board.content;
                })
                .catch(err => {
                    alert("게시글 정보를 가져오는데 실패했습니다.");
                    location.href = "/board/list.html";
                });
        } else {
            alert("잘못된 접근입니다.");
            location.href = "/board/list.html";
        }
    </script>
</body>
</html>
