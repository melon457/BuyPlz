<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godhub - Q&A 문의글 작성</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo" onclick="location.href='/'">Godhub</div>
            <nav class="top-nav">
                <a href="/">홈</a>
                <a href="/about.html">사이트 소개</a>
                <a href="/board/list.html">게시판</a>
                <a href="/board/write.html" class="active">글작성</a>
            </nav>
        </div>
    </header>

    <main class="page-card" style="max-width: 700px;">
        <h1 class="page-title">Q&A 문의글 작성</h1>
        <form id="write-form">
            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" class="qna-input" placeholder="제목을 입력해 주세요" required>
            </div>

            <div class="form-group">
                <label for="writer">작성자</label>
                <input type="text" id="writer" class="qna-input" placeholder="작성자 성함을 입력해 주세요" required>
            </div>

            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content" class="qna-textarea" placeholder="문의 내용을 상세히 작성해 주세요." required></textarea>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px;">
                <a class="btn-gray" href="/board/list.html">취소</a>
                <button type="submit" class="btn-green">등록하기</button>
            </div>
        </form>
    </main>

    <script>
        document.getElementById("write-form").addEventListener("submit", function(e) {
            e.preventDefault();

            const boardData = {
                title: document.getElementById("title").value,
                writer: document.getElementById("writer").value,
                content: document.getElementById("content").value,
                views: 0,
                likes: 0
            };

            fetch("/api/boards", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(boardData)
            })
            .then(response => {
                if (response.ok) {
                    alert("문의글이 성공적으로 저장되었습니다!");
                    location.href = "/board/list.html";
                } else {
                    alert("저장에 실패했습니다.");
                }
            })
            .catch(err => console.error("오류 발생:", err));
        });
    </script>
</body>
</html>
