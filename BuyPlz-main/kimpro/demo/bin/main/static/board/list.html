<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godhub - 고객 Q&A 게시판</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo" onclick="location.href='/'">Godhub</div>
            <nav class="top-nav">
                <a href="/">홈</a>
                <a href="/about.html">사이트 소개</a>
                <a href="/board/list.html" class="active">게시판</a>
                <a href="/board/write.html">글작성</a>
            </nav>
        </div>
    </header>

    <main class="page-card">
        <h1 class="page-title">고객 Q&A 게시판</h1>
        <table class="board-table">
            <thead>
                <tr>
                    <th style="width: 8%;">번호</th>
                    <th style="width: 46%;">제목</th>
                    <th style="width: 14%;">작성자</th>
                    <th style="width: 16%;">작성일</th>
                    <th style="width: 8%;">조회수</th>
                    <th style="width: 8%;">좋아요</th>
                </tr>
            </thead>
            <tbody id="board-list">
                <tr>
                    <td colspan="6">게시글을 불러오는 중...</td>
                </tr>
            </tbody>
        </table>
        <a class="btn-green" href="/board/write.html">글쓰기</a>
    </main>

    <script>
        fetchBoards();

        function fetchBoards() {
            fetch("/api/boards")
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById("board-list");
                list.innerHTML = "";
                
                if (!data || data.length === 0) {
                    list.innerHTML = '<tr><td colspan="6">등록된 게시글이 없습니다.</td></tr>';
                    return;
                }

                data.forEach(board => {
                    const row = document.createElement("tr");
                    const formattedDate = board.createdDate 
                        ? board.createdDate.substring(0, 10) 
                        : '-';

                    row.innerHTML = `
                        <td>${board.id}</td>
                        <td class="title-cell" onclick="goDetail(${board.id})">${board.title}</td>
                        <td>${board.writer}</td>
                        <td>${formattedDate}</td>
                        <td>${board.views ?? 0}</td>
                        <td>${board.likes ?? 0}</td>
                    `;
                    list.appendChild(row);
                });
            })
            .catch(err => console.error("데이터 로드 실패:", err));
        }

        function goDetail(id) {
            location.href = "/board/detail.html?id=" + id;
        }
    </script>
</body>
</html>
